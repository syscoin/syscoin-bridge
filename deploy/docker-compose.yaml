services:
  db:
    image: mongo:8.2.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:?MONGO_HOST_PORT is required}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_APP_DB:-bridge}
    volumes:
      - db-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval 'db.adminCommand({ ping: 1 })' >/dev/null
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  mongo-backup:
    image: mongo:8.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MONGO_HOST: db
      MONGO_PORT: "27017"
      MONGO_USER: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_PASS: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_AUTH_DB: admin
      BACKUP_DB: ${MONGO_APP_DB:-bridge}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - mongo-backups:/backups
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        while true; do
          ts=$$(date +"%Y-%m-%d_%H-%M-%S")
          outdir="/backups/mongodump_$${BACKUP_DB}_$${ts}"
          mkdir -p "$${outdir}"
          mongodump \
            --host "$${MONGO_HOST}" --port "$${MONGO_PORT}" \
            --username "$${MONGO_USER}" --password "$${MONGO_PASS}" \
            --authenticationDatabase "$${MONGO_AUTH_DB}" \
            --db "$${BACKUP_DB}" \
            --out "$${outdir}"
          tar -C /backups -czf "$${outdir}.tar.gz" "$$(basename "$${outdir}")"
          rm -rf "$${outdir}"
          touch /backups/.last-success
          find /backups -type f -name "*.tar.gz" -mtime "+$${RETENTION_DAYS}" -delete
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /backups/.last-success &&
          find /backups/.last-success -mmin -1500 -print -quit | grep -q .
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 2m

  syscoin-bridge:
    image: ${BRIDGE_IMAGE:-ghcr.io/syscoin/syscoin-bridge:main}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${BRIDGE_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${BRIDGE_HOST_PORT:?BRIDGE_HOST_PORT is required}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1))
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

volumes:
  db-data:
    external: true
    name: ${MONGO_DATA_VOLUME:?MONGO_DATA_VOLUME is required}
  mongo-config:
    external: true
    name: ${MONGO_CONFIG_VOLUME:?MONGO_CONFIG_VOLUME is required}
  mongo-backups:
    external: true
    name: ${MONGO_BACKUP_VOLUME:?MONGO_BACKUP_VOLUME is required}
