name: Next Application Build, Push, and Deploy

on:
  release:
    types: [released]
  push:
    branches:
    - "main"
    - "support-pali-v1-backward-compatibility"
    - "sys5-bridge"
    - "update/node20"

jobs:
  docker:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/syscoin/syscoin-bridge
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_COMMIT_HASH=${{ github.sha }}
            NEXT_PUBLIC_REPO_URL=https://github.com/${{ github.repository }}

      - name: Write metadata
        run: "cp $DOCKER_METADATA_OUTPUT_BAKE_FILE metadata.json"

      - name: Save metadata
        uses: actions/upload-artifact@v4
        with:
          name: metadata
          path: metadata.json

  deploy-backends:
    needs: docker
    if: github.event_name == 'push' && github.ref_name == 'main'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: tanenbaum
            environment: staging
            compose_dir: /home/ubuntu/syscoin-bridge-testnet
            bridge_port: "4000"
            api_origin: https://bridge-api.tanenbaum.io
            expected_testnet: "true"
          - name: mainnet
            environment: production
            compose_dir: /home/ubuntu/syscoin-bridge-mainnet
            bridge_port: "3000"
            api_origin: https://bridge-api.syscoin.org
            expected_testnet: "false"
    environment:
      name: ${{ matrix.environment }}
      url: ${{ matrix.api_origin }}
    permissions:
      deployments: write
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Download metadata
        uses: actions/download-artifact@v4
        with:
          name: metadata
          path: ./metadata

      - name: Read Metadata
        id: read-metadata
        run: |
          cd metadata
          image=$(jq -er '.target["docker-metadata-action"].tags[] | select(test(":sha-[0-9a-f]+$"))' metadata.json)
          echo "image=$image" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install ${{ matrix.name }} Compose configuration
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST || secrets.HETZNER_STAGING_HOST }}
          username: ubuntu
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: deploy/docker-compose.yaml
          target: ${{ matrix.compose_dir }}
          strip_components: 1
          overwrite: true

      - name: Deploy ${{ matrix.name }} backend
        uses: appleboy/ssh-action@v1.2.5
        env:
          BRIDGE_IMAGE: ${{ steps.read-metadata.outputs.image }}
          BRIDGE_PORT: ${{ matrix.bridge_port }}
          COMPOSE_DIR: ${{ matrix.compose_dir }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.HETZNER_HOST || secrets.HETZNER_STAGING_HOST }}
          username: ubuntu
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: BRIDGE_IMAGE,BRIDGE_PORT,COMPOSE_DIR,GHCR_TOKEN,GHCR_USER
          script: |
            set -eu
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null
            trap 'sudo docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            cd "$COMPOSE_DIR"
            grep -Eq '^MONGO_ROOT_USER=.+' .env
            grep -Eq '^MONGO_ROOT_PASSWORD=.+' .env
            grep -Eq '^MONGO_HOST_PORT=.+' .env
            grep -Eq '^MONGO_BACKUP_VOLUME=.+' .env
            grep -Eq '^BRIDGE_HOST_PORT=.+' .env
            sudo env BRIDGE_IMAGE="$BRIDGE_IMAGE" docker-compose config --quiet
            sudo env BRIDGE_IMAGE="$BRIDGE_IMAGE" docker-compose pull syscoin-bridge
            sudo env BRIDGE_IMAGE="$BRIDGE_IMAGE" docker-compose up -d --remove-orphans --wait --wait-timeout 300
            container_id=$(sudo env BRIDGE_IMAGE="$BRIDGE_IMAGE" docker-compose ps -q syscoin-bridge)
            test -n "$container_id"
            test "$(sudo docker inspect --format "{{.Config.Image}}" "$container_id")" = "$BRIDGE_IMAGE"
            test "$(curl -fsS "http://127.0.0.1:$BRIDGE_PORT/api/health")" = '{"message":"ok"}'

      - name: Verify ${{ matrix.name }} public API
        env:
          API_ORIGIN: ${{ matrix.api_origin }}
          EXPECTED_TESTNET: ${{ matrix.expected_testnet }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$API_ORIGIN/api/health"
          actual_testnet=$(curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$API_ORIGIN/api/constants" | jq -r '.isTestnet')
          test "$actual_testnet" = "$EXPECTED_TESTNET"
